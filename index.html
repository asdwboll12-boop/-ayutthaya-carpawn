<!DOCTYPE html>
<html lang="th" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StealthShield VPN - Anti-IP Tracker & APK</title>
    
    <!-- PWA Manifest & Meta Tags -->
    <meta name="theme-color" content="#070a14">
    <meta name="description" content="Secure your connection and protect your privacy with StealthShield VPN, featuring advanced anti-IP tracking and secure tunneling.">
    <link rel="manifest" href='data:application/manifest+json,{"name":"StealthShield VPN","short_name":"StealthShield","description":"Secure your connection and protect your privacy with StealthShield VPN, featuring advanced anti-IP tracking and secure tunneling.","start_url":".","display":"standalone","background_color":"#070a14","theme_color":"#070a14","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/2092/2092663.png","sizes":"512x512","type":"image/png","purpose":"any maskable"}]}'>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Prompt', sans-serif;
        }
    </style>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#070a14',
                        cardbg: '#101728',
                        accent: '#2563eb',
                        neon: '#059669',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkbg text-gray-100 min-h-screen flex flex-col justify-between p-4">
    <div class="max-w-md mx-auto w-full bg-cardbg p-6 rounded-2xl shadow-2xl border border-gray-800 my-auto">
        <div class="text-center mb-6">
            <div class="inline-block p-4 bg-accent/10 rounded-full text-accent mb-3 text-3xl">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-wide">StealthShield VPN</h1>
            <p class="text-xs text-gray-400 mt-1">Anti-IP Tracker & Secure Tunnel</p>
        </div>

        <div class="space-y-4">
            <div class="bg-darkbg/50 p-4 rounded-xl border border-gray-800 text-center">
                <span class="text-xs text-gray-400 block">สถานะการเชื่อมต่อ</span>
                <span id="status-text" class="text-neon font-semibold text-lg flex items-center justify-center gap-2 mt-1">
                    <span class="w-3 h-3 rounded-full bg-neon animate-pulse"></span> พร้อมใช้งาน
                </span>
            </div>

            <button onclick="toggleVPN()" id="vpn-btn" class="w-full py-3.5 bg-accent hover:bg-blue-600 transition font-medium rounded-xl shadow-lg shadow-blue-500/20 text-white flex items-center justify-center gap-2">
                <i class="fa-solid fa-power-off"></i> เชื่อมต่อ VPN
            </button>
        </div>
    </div>

    <script>
        function toggleVPN() {
            const statusText = document.getElementById('status-text');
            const vpnBtn = document.getElementById('vpn-btn');
            
            if(vpnBtn.classList.contains('bg-accent')) {
                vpnBtn.classList.remove('bg-accent', 'hover:bg-blue-600', 'shadow-blue-500/20');
                vpnBtn.classList.add('bg-red-600', 'hover:bg-red-700', 'shadow-red-500/20');
                vpnBtn.innerHTML = '<i class="fa-solid fa-power-off"></i> ตัดการเชื่อมต่อ';
                statusText.innerHTML = '<span class="w-3 h-3 rounded-full bg-red-500 animate-pulse"></span> เชื่อมต่อแล้ว (ปลอดภัย)';
                statusText.className = "text-red-400 font-semibold text-lg flex items-center justify-center gap-2 mt-1";
            } else {
                vpnBtn.classList.remove('bg-red-600', 'hover:bg-red-700', 'shadow-red-500/20');
                vpnBtn.classList.add('bg-accent', 'hover:bg-blue-600', 'shadow-blue-500/20');
                vpnBtn.innerHTML = '<i class="fa-solid fa-power-off"></i> เชื่อมต่อ VPN';
                statusText.innerHTML = '<span class="w-3 h-3 rounded-full bg-neon animate-pulse"></span> พร้อมใช้งาน';
                statusText.className = "text-neon font-semibold text-lg flex items-center justify-center gap-2 mt-1";
            }
        }
    </script>
</body>
</html>
